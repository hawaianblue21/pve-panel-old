<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">PVE Panel architecture</title>
<desc id="d">Customers and administrators reach two separate web servers of PVE Panel. PVE Panel talks to Proxmox VE, Proxmox Backup Server, a WireGuard gateway, SeaweedFS and PowerDNS, and to external services such as single sign-on, payments, email, Zammad and an AI assistant. The browser never talks to Proxmox.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C9AFF" stop-opacity=".55"/><stop offset="1" stop-color="#A594FF" stop-opacity=".35"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8FA3BF"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#4C9AFF"/></marker>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="820" rx="20" fill="#0B1220"/>
<rect x=".5" y=".5" width="1199" height="819" rx="20" fill="none" stroke="#243552"/>
<g><rect x="70" y="40" width="380" height="70" rx="12" fill="#16233A" stroke="#4C9AFF" stroke-width="1.5"/><rect x="70" y="50" width="4" height="50" rx="2" fill="#4C9AFF"/><text x="260.0" y="70.0" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF7">Customers</text><text x="260.0" y="89.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Browser · HTTPS</text></g>
<g><rect x="490" y="40" width="380" height="70" rx="12" fill="#16233A" stroke="#A594FF" stroke-width="1.5"/><rect x="490" y="50" width="4" height="50" rx="2" fill="#A594FF"/><text x="680.0" y="70.0" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF7">Administrators</text><text x="680.0" y="89.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Browser · SSH tunnel or VPN</text></g>
<path d="M260 110L260 128" stroke="#8FA3BF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<g><rect x="120" y="128" width="280" height="28" rx="14" fill="#111B2E" stroke="#4C9AFF" stroke-opacity=".6"/><text x="260.0" y="147" text-anchor="middle" font-size="12" fill="#E6EDF7">Reverse proxy · HTTPS (Caddy, Traefik)</text></g>
<path d="M260 156L260 187" stroke="#8FA3BF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M680 110L680 128" stroke="#8FA3BF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<g><rect x="570" y="128" width="220" height="28" rx="14" fill="#111B2E" stroke="#A594FF" stroke-opacity=".6"/><text x="680.0" y="147" text-anchor="middle" font-size="12" fill="#E6EDF7">Local access only · 127.0.0.1</text></g>
<path d="M680 156L680 187" stroke="#A594FF" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="40" y="190" width="860" height="330" rx="18" fill="#111B2E" stroke="url(#panel)" stroke-width="2" filter="url(#sh)"/>
<text x="62" y="214" text-anchor="start" font-size="11.5" font-weight="700" fill="#4C9AFF">PVE PANEL  ·  ONE NODE.JS PROCESS (FASTIFY)</text>
<g><rect x="60" y="240" width="400" height="64" rx="12" fill="#16233A" stroke="#4C9AFF" stroke-width="1.5"/><rect x="60" y="250" width="4" height="44" rx="2" fill="#4C9AFF"/><text x="260.0" y="267.0" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF7">Customer portal</text><text x="260.0" y="286.0" text-anchor="middle" font-size="12" fill="#8FA3BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.0.0.0:3000 · customer routes only</text></g>
<g><rect x="480" y="240" width="400" height="64" rx="12" fill="#16233A" stroke="#A594FF" stroke-width="1.5"/><rect x="480" y="250" width="4" height="44" rx="2" fill="#A594FF"/><text x="680.0" y="267.0" text-anchor="middle" font-size="15" font-weight="600" fill="#E6EDF7">Admin portal</text><text x="680.0" y="286.0" text-anchor="middle" font-size="12" fill="#8FA3BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">127.0.0.1:3001 · local by default</text></g>
<text x="470" y="324" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8FA3BF">two separate web servers · separate cookies and signing keys</text>
<g><rect x="60" y="340" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="190.0" y="359.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Authentication</text><text x="190.0" y="378.0" text-anchor="middle" font-size="11" fill="#8FA3BF">password · 2FA · passkeys · SSO</text></g>
<g><rect x="340" y="340" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="470.0" y="359.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Ownership checks</text><text x="470.0" y="378.0" text-anchor="middle" font-size="11" fill="#8FA3BF">not your server = 404</text></g>
<g><rect x="620" y="340" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="750.0" y="359.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Roles and quotas</text><text x="750.0" y="378.0" text-anchor="middle" font-size="11" fill="#8FA3BF">RBAC · pools · plans</text></g>
<g><rect x="60" y="398" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="190.0" y="417.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Jobs and schedulers</text><text x="190.0" y="436.0" text-anchor="middle" font-size="11" fill="#8FA3BF">provision · snapshots · backups · updates</text></g>
<g><rect x="340" y="398" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="470.0" y="417.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Console proxy</text><text x="470.0" y="436.0" text-anchor="middle" font-size="11" fill="#8FA3BF">single-use, short-lived sessions</text></g>
<g><rect x="620" y="398" width="260" height="48" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="750.0" y="417.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E6EDF7">Audit log</text><text x="750.0" y="436.0" text-anchor="middle" font-size="11" fill="#8FA3BF">who did what, from where</text></g>
<g><rect x="60" y="462" width="820" height="44" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="470.0" y="489.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF7">SQLite  ·  data/panel.db</text></g>
<text opacity="0" x="470" y="503" text-anchor="middle" font-size="12" font-weight="500" fill="#8FA3BF"></text>
<path d="M470 520L470 566" stroke="#4C9AFF" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
<text x="486" y="548" text-anchor="start" font-size="12" font-weight="500" fill="#8FA3BF">Proxmox API token · TLS verified · server side only</text>
<rect x="40" y="570" width="860" height="190" rx="18" fill="#111B2E" stroke="#243552"/>
<text x="62" y="594" text-anchor="start" font-size="11.5" font-weight="700" fill="#3DD68C">INFRASTRUCTURE</text>
<g><rect x="60" y="610" width="152" height="130" rx="12" fill="#16233A" stroke="#3DD68C" stroke-width="1.5"/><rect x="60" y="620" width="4" height="110" rx="2" fill="#3DD68C"/><text x="136.0" y="654.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">Proxmox VE</text><text x="136.0" y="673.0" text-anchor="middle" font-size="12" fill="#8FA3BF">clusters 1 to N</text><text x="136.0" y="689.0" text-anchor="middle" font-size="12" fill="#8FA3BF">VM · LXC · SDN</text><text x="136.0" y="705.0" text-anchor="middle" font-size="12" fill="#8FA3BF">storage</text></g>
<g><rect x="227" y="610" width="152" height="130" rx="12" fill="#16233A" stroke="#3DD68C" stroke-width="1.5"/><rect x="227" y="620" width="4" height="110" rx="2" fill="#3DD68C"/><text x="303.0" y="654.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">Backup Server</text><text x="303.0" y="673.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Proxmox Backup</text><text x="303.0" y="689.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Server (PBS)</text><text x="303.0" y="705.0" text-anchor="middle" font-size="12" fill="#8FA3BF">restore points</text></g>
<g><rect x="394" y="610" width="152" height="130" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="470.0" y="662.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">WireGuard</text><text x="470.0" y="681.0" text-anchor="middle" font-size="12" fill="#8FA3BF">gateway VM</text><text x="470.0" y="697.0" text-anchor="middle" font-size="12" fill="#8FA3BF">customer VPN</text></g>
<g><rect x="561" y="610" width="152" height="130" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="637.0" y="662.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">SeaweedFS</text><text x="637.0" y="681.0" text-anchor="middle" font-size="12" fill="#8FA3BF">S3 object</text><text x="637.0" y="697.0" text-anchor="middle" font-size="12" fill="#8FA3BF">storage</text></g>
<g><rect x="728" y="610" width="152" height="130" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="804.0" y="662.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">PowerDNS</text><text x="804.0" y="681.0" text-anchor="middle" font-size="12" fill="#8FA3BF">reverse DNS</text><text x="804.0" y="697.0" text-anchor="middle" font-size="12" fill="#8FA3BF">for public IPs</text></g>
<rect x="940" y="190" width="220" height="570" rx="18" fill="#111B2E" stroke="#243552"/>
<text x="962" y="214" text-anchor="start" font-size="11.5" font-weight="700" fill="#F5B947">EXTERNAL SERVICES</text>
