<g><rect x="960" y="340" width="180" height="90" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="1050.0" y="372.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">Payments</text><text x="1050.0" y="391.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Xendit · Midtrans</text><text x="1050.0" y="407.0" text-anchor="middle" font-size="12" fill="#8FA3BF">bank transfer</text></g>
<g><rect x="960" y="444" width="180" height="90" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="1050.0" y="476.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">Email</text><text x="1050.0" y="495.0" text-anchor="middle" font-size="12" fill="#8FA3BF">SMTP · invitations</text><text x="1050.0" y="511.0" text-anchor="middle" font-size="12" fill="#8FA3BF">notifications</text></g>
<g><rect x="960" y="548" width="180" height="90" rx="12" fill="#16233A" stroke="#243552" stroke-width="1"/><text x="1050.0" y="580.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#E6EDF7">Helpdesk</text><text x="1050.0" y="599.0" text-anchor="middle" font-size="12" fill="#8FA3BF">Zammad sync</text><text x="1050.0" y="615.0" text-anchor="middle" font-size="12" fill="#8FA3BF">(optional)</text></g>
